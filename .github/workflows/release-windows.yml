name: Build signed Windows installer
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Import signing material
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { throw 'A trusted Windows code signing certificate is required for a public release.' }
          $path = Join-Path $env:RUNNER_TEMP 'storagescope-signing.p12'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_PATH=$path" >> $env:GITHUB_ENV
      - name: Install installer compiler
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Installer compiler checksum mismatch.' }
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-portable'
          $process = Start-Process -FilePath $download -ArgumentList @('/PORTABLE=1','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$compiler+'"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Inno Setup preparation failed.' }
          $compiler >> $env:GITHUB_PATH
      - name: Build and verify both native payloads and signed installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_UPDATE_PRIVATE_KEY_PEM_BASE64: ${{ secrets.WINDOWS_UPDATE_PRIVATE_KEY_PEM_BASE64 }}
        run: ./scripts/build-windows-release.ps1 -Tag $env:RELEASE_TAG
      - name: Test safety and update verification
        shell: pwsh
        run: dotnet run --project Windows/StorageScope.Windows.Tests --configuration Release
      - name: Verify installation and offline launch in isolated runner
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'storagescope-install-test'
          $installer = Join-Path $PWD 'release-assets/StorageScope-Windows-Setup.exe'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="'+$destination+'"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $version = ([xml](Get-Content 'Windows/StorageScope.Windows/StorageScope.Windows.csproj')).Project.PropertyGroup.Version
          $application = Join-Path $destination "versions/$version/StorageScope.exe"
          if (-not (Test-Path -LiteralPath $application)) { throw 'Native executable missing after installation.' }
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $health = Start-Process -FilePath $application -ArgumentList '--verify-installation' -WindowStyle Hidden -PassThru -Wait
          if ($health.ExitCode -ne 0) { throw 'Installed application failed offline startup verification.' }
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
      - name: Delete temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'storagescope-signing.p12'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }
