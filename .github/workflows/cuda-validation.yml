name: CUDA 12 isolated uninstall
on:
  push:
    branches: [main, "codex/**"]
    paths:
      - '.github/workflows/cuda-validation.yml'
      - 'scripts/test-cuda-isolated.ps1'
      - 'Windows/StorageScope.Windows/NvidiaCudaProvider.cs'
      - 'Windows/StorageScope.Windows.Tests/CudaTests.cs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install only disposable CUDA compiler and documentation; verify official removal
        shell: pwsh
        run: ./scripts/test-cuda-isolated.ps1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cuda-isolated-validation
          path: ${{ runner.temp }}/cuda-validation
