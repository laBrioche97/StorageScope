name: Targeted installed Mac trash diagnostic
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: macos-validated-package-candidate
          path: .
          run-id: '41097171737'
          github-token: ${{ github.token }}
      - name: Diagnose actual installed Explorer trash operation
        run: python3 scripts/test-macos-package.py release-assets/StorageScope-macOS-arm64-DEVELOPMENT.pkg
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos-trash-fast-diagnostic
          path: |
            ${{ runner.temp }}/storagescope-explorer-trash-*
            ${{ runner.temp }}/storagescope-packaged-ui/*.png
            ${{ runner.temp }}/storagescope-application-removal-*.json
          if-no-files-found: warn
