name: Release macOS application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v2.0.1)
        required: true
        type: string

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build universal release
    runs-on: macos-14
    timeout-minutes: 45
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      REQUESTED_TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate tag and bundle version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null
          VERSION="${TAG#v}"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          if [[ "$PLIST_VERSION" != "$VERSION" ]]; then
            echo "Tag $TAG does not match CFBundleShortVersionString $PLIST_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Lint scripts and metadata
        run: |
          plutil -lint Packaging/Info.plist
          plutil -lint Packaging/PrivacyInfo.xcprivacy
          zsh -n scripts/build-app.sh
          zsh -n scripts/install-release.sh

      - name: Build and run validations
        run: |
          swift build --disable-sandbox -Xswiftc -warnings-as-errors
          TEST_BINARY="$(swift build --disable-sandbox --product StorageCoreTests --show-bin-path)/StorageCoreTests"
          "$TEST_BINARY"

      - name: Import Developer ID certificate
        id: signing
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/storagescope-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' 'NR == 1 { print $2 }')"
          if [[ "$IDENTITY" != "Developer ID Application:"* ]]; then
            echo "No Developer ID Application identity found in the supplied certificate." >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build universal application bundle
        shell: bash
        env:
          RELEASE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          SIGNING_IDENTITY="${RELEASE_SIGNING_IDENTITY:--}"
          STORAGESCOPE_ARCHITECTURES=universal \
          STORAGESCOPE_SIGNING_IDENTITY="$SIGNING_IDENTITY" \
          ./scripts/build-app.sh
          ARCHITECTURES="$(lipo -archs dist/StorageScope.app/Contents/MacOS/StorageScope)"
          [[ " $ARCHITECTURES " == *" arm64 "* ]]
          [[ " $ARCHITECTURES " == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 dist/StorageScope.app

      - name: Create release archives
        run: |
          mkdir -p release-assets
          xattr -cr dist/StorageScope.app
          codesign --verify --deep --strict --verbose=2 dist/StorageScope.app
          ditto -c -k --sequesterRsrc --keepParent dist/StorageScope.app release-assets/StorageScope-universal.zip
          ditto -c -k --keepParent dist/StorageScope.app.dSYM release-assets/StorageScope-dSYM.zip

      - name: Notarize and staple application
        if: >-
          steps.signing.outputs.identity != '' &&
          env.APPLE_API_KEY_P8_BASE64 != '' &&
          env.APPLE_API_KEY_ID != '' &&
          env.APPLE_API_ISSUER_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          xcrun notarytool submit release-assets/StorageScope-universal.zip \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/StorageScope.app
          xcrun stapler validate dist/StorageScope.app
          spctl --assess --type execute --verbose=2 dist/StorageScope.app
          rm -f release-assets/StorageScope-universal.zip
          ditto -c -k --sequesterRsrc --keepParent dist/StorageScope.app release-assets/StorageScope-universal.zip

      - name: Write SHA-256 checksum
        working-directory: release-assets
        run: shasum -a 256 StorageScope-universal.zip > StorageScope-universal.zip.sha256

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageScope-${{ env.RELEASE_VERSION }}-universal
          path: |
            release-assets/StorageScope-universal.zip
            release-assets/StorageScope-universal.zip.sha256
            release-assets/StorageScope-dSYM.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(
            release-assets/StorageScope-universal.zip
            release-assets/StorageScope-universal.zip.sha256
            release-assets/StorageScope-dSYM.zip
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "StorageScope $RELEASE_VERSION"
          fi

      - name: Delete temporary signing keychain
        if: always() && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/storagescope-signing.keychain-db" || true
