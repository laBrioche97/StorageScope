name: Publish verified StorageScope release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || vars.STORAGESCOPE_SIGNED_RELEASES_ENABLED == 'true'
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
  macos:
    if: github.event_name == 'workflow_dispatch' || vars.STORAGESCOPE_SIGNED_RELEASES_ENABLED == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate and test
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          plutil -lint Packaging/Info.plist Packaging/PrivacyInfo.xcprivacy
          zsh -n scripts/build-app.sh scripts/build-macos-release.sh
          swift build --disable-sandbox -Xswiftc -warnings-as-errors
          swift run --disable-sandbox StorageCoreTests
      - name: Import Developer ID identities
        shell: bash
        env:
          APP_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APP_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          STORAGESCOPE_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for NAME in APP_CERTIFICATE APP_PASSWORD INSTALLER_CERTIFICATE INSTALLER_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID STORAGESCOPE_SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY; do
            [[ -n "${!NAME}" ]] || { echo "Missing signing configuration: $NAME" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/storagescope-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APP_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/app.p12" -P "$APP_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "$INSTALLER_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | awk -F '"' '/Developer ID Installer:/ { print $2; exit }')"
          [[ -n "$APP_IDENTITY" && -n "$INSTALLER_IDENTITY" ]]
          echo "STORAGESCOPE_SIGNING_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "STORAGESCOPE_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and generate Sparkle feed
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          STORAGESCOPE_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: zsh scripts/build-macos-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v5
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
      - name: Delete temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/storagescope-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP"/AuthKey_*.p8
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete release and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          for FILE in StorageScope-Windows-Setup.exe StorageScope-Windows-Setup.exe.sha256 windows-update.json windows-update.json.sig StorageScope-macOS-universal.pkg StorageScope-macOS-universal.pkg.sha256 StorageScope-universal.zip StorageScope-universal.zip.sha256 appcast.xml; do
            [[ -s "release-assets/$FILE" && ! -L "release-assets/$FILE" ]]
          done
          (cd release-assets && sha256sum --check ./*.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Use a new version; published assets are immutable.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --title "StorageScope ${RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
